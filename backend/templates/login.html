<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - GPS Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="contenedor-formulario-auth text-center" style="max-width: 420px; padding: 35px; border-radius: 8px;">
        
        <!-- Logo Circular -->
        <div class="logo-circle">
            <i class="bi bi-geo-alt-fill text-primary fs-2"></i>
        </div>
        
        <h3 class="mb-4 fw-bold text-dark">Iniciar sesión</h3>
        
        <form action="{{ url_for('login') }}" method="POST" class="form-registro text-start">
            
            <div class="grupo-input mb-3">
                <label for="correo" class="form-label text-muted small fw-bold">USUARIO</label>
                <input type="email" id="correo" name="correo" class="input-rectangular" placeholder="correo@example.com" required>
            </div>
            
            <div class="grupo-input mb-2">
                <label for="password" class="form-label text-muted small fw-bold">CONTRASEÑA</label>
                <input type="password" id="password" name="contrasena" class="input-rectangular" placeholder="********" required>
            </div>
            
            <!-- Enlace Olvidé mi contraseña -->
            <div class="mb-4 text-start">
                <a href="{{ url_for('olvide_contrasena') }}">¿Olvidaste tu contraseña?</a>
            </div>
            
            <!-- Botón Entrar Rectangular -->
            <div class="acciones-formulario d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-rectangular shadow-sm">ENTRAR</button>
            </div>

            <!-- Volver al inicio -->
            <div class="text-center">
                <a href="/" class="text-muted small text-decoration-none">Volver al inicio</a>
            </div>
            
        </form>
    </div>

</body>
</html>
