{% extends "base_auth.html" %}
 
{% block title %}Nuevo Cliente - GPS Control{% endblock %}
 
{% block content %}
<div class="contenedor-formulario-auth">
    <h2>Nuevo Cliente</h2>
 
    {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">
            {{ error }}
        </div>
    {% endif %}
 
    <form method="POST" class="form-registro">
 
        <div class="grupo-input">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
 
        <div class="grupo-input">
            <label for="rnc_cedula">RNC / Cédula:</label>
            <input type="text" id="rnc_cedula" name="rnc_cedula" required>
        </div>
 
        <div class="grupo-input">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono" required>
        </div>
 
        <div class="acciones-formulario">
            <button type="submit" class="btn-accion-principal">Guardar</button>
            <a href="{{ url_for('clientes_bp.clientes') }}" class="btn-secundario">Volver a la lista</a>
        </div>
 
    </form>
</div>
{% endblock %}
