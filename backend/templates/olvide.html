{% extends "base_auth.html" %}

{% block title %}Recuperación de contraseña - GPS Control{% endblock %}

{% block content %}
<div class="contenedor-formulario-auth">
    <h2>Recuperación de contraseña</h2>
    
    <div class="contenido-informativo" style="text-align: center; margin: 20px 0;">
        <p>Para inconvenientes o recuperación de contraseña, favor de <strong>contactar al administrador</strong> del sistema.</p>
    </div>

    <div class="acciones-formulario">
        <a href="{{ url_for('login') }}" class="btn-accion-principal" style="display: block; text-align: center; text-decoration: none;">Volver al inicio de sesión</a>
    </div>

</div>
{% endblock %}
