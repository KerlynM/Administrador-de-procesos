{% extends "base_auth.html" %}

{% block title %}Nuevo usuario - GPS Control{% endblock %}

{% block content %}
<div class="contenedor-formulario-auth">
    <h2>Registrar nuevo usuario</h2>

    <form method="POST" class="form-registro">

        <div class="grupo-input">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="grupo-input">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required>
        </div>

        <div class="grupo-input">
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" required>
        </div>

        <div class="grupo-input">
            <label for="rol">Rol:</label>
            <select id="rol" name="rol" required>
                <option value="">Seleccione un rol</option>
                <option value="Administrador">Administrador</option>
                <option value="Operaciones">Operaciones</option>
                <option value="Digitador">Digitador</option>
            </select>
        </div>

        <div class="acciones-formulario">
            <button type="submit" class="btn-accion-principal">Guardar usuario</button>
            <a href="javascript:history.back()" class="btn-secundario">Volver atrás</a>
        </div>

    </form>
</div>
{% endblock %}
